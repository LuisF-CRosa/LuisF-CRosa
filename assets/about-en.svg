<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 569" width="1200" height="569" role="img" aria-label="I'm Luís Felipe, a Computer Engineering student at Insper, in São Paulo. I'm drawn to systems that sense the world and act on it, so most of my time goes into robotics and computer vision: from ROS 2 nodes on a TurtleBot3 to the perception pipeline of an autonomous drone. At the SMASH Robotics League I captain SkyFox, the team building Tails, an autonomous quadrotor for the SAE Brasil EletroQuad. The role is half engineering and half leadership: shaping the autonomy stack on PX4, ROS 2 and Gazebo, running the team's infrastructure and website, and keeping everyone aligned on what comes next. I'm a Teaching Assistant in Data Science at Insper, helping students turn Python and statistics into analyses that answer real questions. I'm also HR Director at Insper Code Jr., where I joined as a web developer and now lead member selection and onboarding. Open to internships and summer programs in data, AI and engineering.">
