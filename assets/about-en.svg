<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 691" width="1200" height="691" role="img" aria-label="I'm Luís Felipe, a Computer Engineering student at Insper, in São Paulo. I like turning technology into real value, whether that means analyzing data to support a decision, building an autonomous system or helping a team grow. My interests span AI, data science, computer vision and autonomous systems, and I'm also curious about technology in the financial market. As a Teaching Assistant in Data Science, I help students turn Python and statistics into analyses that answer real questions. I review projects, spot where students get stuck and explain technical results in plain language. At Insper Code Jr., Insper's software junior enterprise, I'm the HR Director. I joined as a web developer and today I lead member selection and onboarding, making sure new people find their place and grow with the team. At the SMASH Robotics League I captain SkyFox, the team building Tails, an autonomous quadrotor for the SAE Brasil EletroQuad. The role is half engineering and half leadership: shaping the autonomy stack on PX4, ROS 2 and Gazebo and keeping everyone aligned on what comes next. Open to internships and summer programs in data, AI, technology and engineering.">
