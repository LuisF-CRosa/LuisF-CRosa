    <text class="sans" x="64" y="417" font-size="16.5" fill="#9FB4C8">analyses that answer real questions. I'm also <tspan fill="#E6F1FF" font-weight="700">HR</tspan> <tspan fill="#E6F1FF" font-weight="700">Director</tspan> <tspan fill="#E6F1FF" font-weight="700">at</tspan> <tspan fill="#E6F1FF" font-weight="700">Insper</tspan> <tspan fill="#E6F1FF" font-weight="700">Code</tspan> <tspan fill="#E6F1FF" font-weight="700">Jr.</tspan>, where I joined as a web</text>
    <text class="mono" x="40" y="444" font-size="13" fill="#3A5874" text-anchor="end">13</text>
    <text class="sans" x="64" y="444" font-size="16.5" fill="#9FB4C8">developer and now lead member selection and onboarding.</text>
