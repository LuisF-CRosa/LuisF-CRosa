    <text class="sans" x="64" y="512" font-size="16.5" fill="#9FB4C8">At the <tspan fill="#E6F1FF" font-weight="700">SMASH</tspan> <tspan fill="#E6F1FF" font-weight="700">Robotics</tspan> <tspan fill="#E6F1FF" font-weight="700">League</tspan> I captain <tspan fill="#E6F1FF" font-weight="700">SkyFox</tspan>, the team building Tails, an autonomous quadrotor for the</text>
