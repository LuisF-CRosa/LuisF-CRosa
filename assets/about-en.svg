    <text class="sans" x="64" y="390" font-size="16.5" fill="#9FB4C8">I'm a <tspan fill="#E6F1FF" font-weight="700">Teaching</tspan> <tspan fill="#E6F1FF" font-weight="700">Assistant</tspan> <tspan fill="#E6F1FF" font-weight="700">in</tspan> <tspan fill="#E6F1FF" font-weight="700">Data</tspan> <tspan fill="#E6F1FF" font-weight="700">Science</tspan> at Insper, helping students turn Python and statistics into</text>
