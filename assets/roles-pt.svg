      @keyframes blink { 0%,60% { opacity: 1 } 60.01%,100% { opacity: .15 } }
      @keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes sweep { from { transform: translateY(-70px) } to { transform: translateY(290px) } }
    </style>
