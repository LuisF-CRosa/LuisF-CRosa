    <text class="sans" x="64" y="390" font-size="16.5" fill="#9FB4C8">Na <tspan fill="#E6F1FF" font-weight="700">Insper</tspan> <tspan fill="#E6F1FF" font-weight="700">Code</tspan> <tspan fill="#E6F1FF" font-weight="700">Jr.</tspan>, a empresa júnior de software do Insper, sou <tspan fill="#E6F1FF" font-weight="700">Diretor</tspan> <tspan fill="#E6F1FF" font-weight="700">de</tspan> <tspan fill="#E6F1FF" font-weight="700">RH</tspan>. Entrei como desenvolvedor</text>
    <text class="mono" x="40" y="417" font-size="13" fill="#3A5874" text-anchor="end">12</text>
    <text class="sans" x="64" y="417" font-size="16.5" fill="#9FB4C8">web e hoje lidero a seleção e o onboarding de membros, garantindo que quem chega encontre seu espaço e</text>
    <text class="mono" x="40" y="444" font-size="13" fill="#3A5874" text-anchor="end">13</text>
    <text class="sans" x="64" y="444" font-size="16.5" fill="#9FB4C8">cresça com a equipe.</text>
    </g>
