    <text class="mono" x="40" y="512" font-size="13" fill="#3A5874" text-anchor="end">15</text>
    <text class="sans" x="64" y="512" font-size="16.5" fill="#9FB4C8">Na <tspan fill="#E6F1FF" font-weight="700">Liga</tspan> <tspan fill="#E6F1FF" font-weight="700">SMASH</tspan> <tspan fill="#E6F1FF" font-weight="700">Robotics</tspan> sou capitão da <tspan fill="#E6F1FF" font-weight="700">SkyFox</tspan>, equipe que desenvolve o Tails, um quadricóptero autônomo</text>
    <text class="mono" x="40" y="539" font-size="13" fill="#3A5874" text-anchor="end">16</text>
