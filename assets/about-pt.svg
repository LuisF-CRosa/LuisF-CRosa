<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 691" width="1200" height="691" role="img" aria-label="Sou o Luís Felipe, estudante de Engenharia da Computação no Insper, em São Paulo. Gosto de transformar tecnologia em valor real, seja analisando dados para apoiar uma decisão, construindo um sistema autônomo ou ajudando uma equipe a crescer. Meus interesses passam por IA, ciência de dados, visão computacional e sistemas autônomos, e também tenho curiosidade pela tecnologia no mercado financeiro. Como monitor de Ciência dos Dados, ajudo alunos a transformar Python e estatística em análises que respondem perguntas reais. Reviso projetos, identifico onde os alunos travam e explico resultados técnicos de forma clara. Na Insper Code Jr., a empresa júnior de software do Insper, sou Diretor de RH. Entrei como desenvolvedor web e hoje lidero a seleção e o onboarding de membros, garantindo que quem chega encontre seu espaço e cresça com a equipe. Na Liga SMASH Robotics sou capitão da SkyFox, equipe que desenvolve o Tails, um quadricóptero autônomo para a SAE Brasil EletroQuad. O papel é metade engenharia e metade liderança: construir a stack de autonomia com PX4, ROS 2 e Gazebo e manter todos alinhados sobre o próximo passo. Aberto a estágios e summer jobs em dados, IA, tecnologia e engenharia.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="1" stop-color="#0B1A2B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3A57" stroke-width="1" opacity="0.28"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="691" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace; }
      .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .fade { animation: fade .9s ease-out both; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .scanline { animation: scan 6s linear infinite; }
      @keyframes fade { from { opacity: 0; transform: translateX(-8px) } to { opacity: 1; transform: none } }
      @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
      @keyframes scan { from { transform: translateY(-120px) } to { transform: translateY(711px) } }
    </style>
  </defs>
