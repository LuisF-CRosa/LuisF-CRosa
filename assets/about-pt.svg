<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 569" width="1200" height="569" role="img" aria-label="Sou o Luís Felipe, estudante de Engenharia da Computação no Insper, em São Paulo. Gosto de sistemas que percebem o mundo e agem sobre ele, por isso passo boa parte do tempo com robótica e visão computacional: de nós em ROS 2 num TurtleBot3 ao pipeline de percepção de um drone autônomo. Na Liga SMASH Robotics sou capitão da SkyFox, equipe que desenvolve o Tails, um quadricóptero autônomo para a SAE Brasil EletroQuad. O papel é metade engenharia e metade liderança: construir a stack de autonomia com PX4, ROS 2 e Gazebo, cuidar da infraestrutura e do site da equipe e manter todos alinhados sobre o próximo passo. Sou monitor de Ciência dos Dados no Insper, ajudando alunos a transformar Python e estatística em análises que respondem perguntas reais. Também sou Diretor de RH da Insper Code Jr., onde entrei como desenvolvedor web e hoje lidero a seleção e o onboarding. Aberto a estágios e summer jobs em dados, IA e engenharia.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="1" stop-color="#0B1A2B"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B3A57" stroke-width="1" opacity="0.28"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="569" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono','Courier New',monospace; }
      .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .fade { animation: fade .9s ease-out both; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .scanline { animation: scan 6s linear infinite; }
      @keyframes fade { from { opacity: 0; transform: translateX(-8px) } to { opacity: 1; transform: none } }
      @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
      @keyframes scan { from { transform: translateY(-120px) } to { transform: translateY(589px) } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="569" fill="url(#bg)"/>
    <rect width="1200" height="569" fill="url(#grid)"/>
    <rect class="scanline" width="1200" height="110" fill="url(#scan)"/>
    <!-- barra de título -->
    <rect width="1200" height="48" fill="#08111D"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#1E4A6E"/>
    <circle cx="28" cy="24" r="6" fill="#F87171"/>
    <circle cx="48" cy="24" r="6" fill="#FBBF24"/>
    <circle cx="68" cy="24" r="6" fill="#34D399"/>
    <text class="mono" x="600" y="29" font-size="13.5" fill="#5B7A99" text-anchor="middle" letter-spacing="1">~/luisf-crosa/sobre_mim.md</text>
    <text class="mono" x="1172" y="29" font-size="12" fill="#34D399" text-anchor="end" letter-spacing="2">● LIVE</text>
    <line x1="52" y1="48" x2="52" y2="569" stroke="#14304A"/>
    <g class="fade" style="animation-delay:0.3s">
    <text class="mono" x="40" y="92" font-size="13" fill="#3A5874" text-anchor="end">01</text>
    <text class="mono" x="64" y="92" font-size="14.5" fill="#22D3EE" letter-spacing="1.5">// QUEM SOU</text>
    <text class="mono" x="40" y="119" font-size="13" fill="#3A5874" text-anchor="end">02</text>
    <text class="sans" x="64" y="119" font-size="16.5" fill="#9FB4C8">Sou o <tspan fill="#E6F1FF" font-weight="700">Luís</tspan> <tspan fill="#E6F1FF" font-weight="700">Felipe</tspan>, estudante de Engenharia da Computação no <tspan fill="#E6F1FF" font-weight="700">Insper</tspan>, em São Paulo. Gosto de sistemas que</text>
    <text class="mono" x="40" y="146" font-size="13" fill="#3A5874" text-anchor="end">03</text>
    <text class="sans" x="64" y="146" font-size="16.5" fill="#9FB4C8">percebem o mundo e agem sobre ele, por isso passo boa parte do tempo com robótica e visão computacional:</text>
    <text class="mono" x="40" y="173" font-size="13" fill="#3A5874" text-anchor="end">04</text>
    <text class="sans" x="64" y="173" font-size="16.5" fill="#9FB4C8">de nós em ROS 2 num TurtleBot3 ao pipeline de percepção de um drone autônomo.</text>
    </g>
    <g class="fade" style="animation-delay:0.8s">
    <text class="mono" x="40" y="214" font-size="13" fill="#3A5874" text-anchor="end">05</text>
    <text class="mono" x="64" y="214" font-size="14.5" fill="#22D3EE" letter-spacing="1.5">// SMASH ROBOTICS</text>
    <text class="mono" x="40" y="241" font-size="13" fill="#3A5874" text-anchor="end">06</text>
    <text class="sans" x="64" y="241" font-size="16.5" fill="#9FB4C8">Na <tspan fill="#E6F1FF" font-weight="700">Liga</tspan> <tspan fill="#E6F1FF" font-weight="700">SMASH</tspan> <tspan fill="#E6F1FF" font-weight="700">Robotics</tspan> sou capitão da <tspan fill="#E6F1FF" font-weight="700">SkyFox</tspan>, equipe que desenvolve o Tails, um quadricóptero autônomo</text>
    <text class="mono" x="40" y="268" font-size="13" fill="#3A5874" text-anchor="end">07</text>
    <text class="sans" x="64" y="268" font-size="16.5" fill="#9FB4C8">para a SAE Brasil EletroQuad. O papel é metade engenharia e metade liderança: construir a stack de</text>
    <text class="mono" x="40" y="295" font-size="13" fill="#3A5874" text-anchor="end">08</text>
    <text class="sans" x="64" y="295" font-size="16.5" fill="#9FB4C8">autonomia com PX4, ROS 2 e Gazebo, cuidar da infraestrutura e do site da equipe e manter todos alinhados</text>
    <text class="mono" x="40" y="322" font-size="13" fill="#3A5874" text-anchor="end">09</text>
    <text class="sans" x="64" y="322" font-size="16.5" fill="#9FB4C8">sobre o próximo passo.</text>
    </g>
    <g class="fade" style="animation-delay:1.3s">
    <text class="mono" x="40" y="363" font-size="13" fill="#3A5874" text-anchor="end">10</text>
    <text class="mono" x="64" y="363" font-size="14.5" fill="#22D3EE" letter-spacing="1.5">// INSPER · CODE JR.</text>
    <text class="mono" x="40" y="390" font-size="13" fill="#3A5874" text-anchor="end">11</text>
    <text class="sans" x="64" y="390" font-size="16.5" fill="#9FB4C8">Sou <tspan fill="#E6F1FF" font-weight="700">monitor</tspan> <tspan fill="#E6F1FF" font-weight="700">de</tspan> <tspan fill="#E6F1FF" font-weight="700">Ciência</tspan> <tspan fill="#E6F1FF" font-weight="700">dos</tspan> <tspan fill="#E6F1FF" font-weight="700">Dados</tspan> no Insper, ajudando alunos a transformar Python e estatística em análises</text>
    <text class="mono" x="40" y="417" font-size="13" fill="#3A5874" text-anchor="end">12</text>
    <text class="sans" x="64" y="417" font-size="16.5" fill="#9FB4C8">que respondem perguntas reais. Também sou <tspan fill="#E6F1FF" font-weight="700">Diretor</tspan> <tspan fill="#E6F1FF" font-weight="700">de</tspan> <tspan fill="#E6F1FF" font-weight="700">RH</tspan> <tspan fill="#E6F1FF" font-weight="700">da</tspan> <tspan fill="#E6F1FF" font-weight="700">Insper</tspan> <tspan fill="#E6F1FF" font-weight="700">Code</tspan> <tspan fill="#E6F1FF" font-weight="700">Jr.</tspan>, onde entrei como desenvolvedor</text>
    <text class="mono" x="40" y="444" font-size="13" fill="#3A5874" text-anchor="end">13</text>
    <text class="sans" x="64" y="444" font-size="16.5" fill="#9FB4C8">web e hoje lidero a seleção e o onboarding.</text>
    </g>
    <g class="fade" style="animation-delay:1.8s">
    <text class="mono" x="40" y="485" font-size="13" fill="#3A5874" text-anchor="end">14</text>
    <text class="mono" x="64" y="485" font-size="14.5" fill="#22D3EE" letter-spacing="1.5">// PRÓXIMO PASSO</text>
    <text class="mono" x="40" y="512" font-size="13" fill="#3A5874" text-anchor="end">15</text>
    <text class="sans" x="64" y="512" font-size="16.5" fill="#9FB4C8">Aberto a <tspan fill="#E6F1FF" font-weight="700">estágios</tspan> <tspan fill="#E6F1FF" font-weight="700">e</tspan> <tspan fill="#E6F1FF" font-weight="700">summer</tspan> <tspan fill="#E6F1FF" font-weight="700">jobs</tspan> em dados, IA e engenharia.</text>
    </g>
    <rect class="blink" x="64" y="520" width="10" height="3" fill="#22D3EE"/>
    <rect x="1" y="1" width="1198" height="567" rx="17" fill="none" stroke="#1E4A6E" stroke-width="2"/>
  </g>
</svg>
